name: Continuous Delivery

on:
  workflow_dispatch
  # To enable automatic deployment on merge to main, uncomment the lines below:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'agents/**'
  #     - 'Dockerfile'
  #     - 'pyproject.toml'

jobs:
  build-and-deploy:
    name: Build & Deploy Application Container
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_WI_PROVIDER_ID: ${{ vars.GCP_WI_PROVIDER_ID }}
      GCP_SA_GITHUB_ACTIONS: ${{ vars.GCP_SA_GITHUB_ACTIONS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud Project
        uses: 'google-github-actions/auth@v2'
        with:
          service_account: ${{ env.GCP_SA_GITHUB_ACTIONS }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          workload_identity_provider: ${{ env.GCP_WI_PROVIDER_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Submit Cloud Build & Push to Artifact Registry
        run: |
          IMAGE_URI="${{ env.GCP_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/luncher-repo/luncher"
          gcloud builds submit "." \
            --tag "${IMAGE_URI}:${{ steps.slug.outputs.sha7 }}" \
            --region ${{ env.GCP_LOCATION }}
          gcloud artifacts docker tags add \
            "${IMAGE_URI}:${{ steps.slug.outputs.sha7 }}" \
            "${IMAGE_URI}:latest"

      - name: Deploy Container Update to Cloud Run
        run: |
          gcloud run deploy luncher-service \
            --image "${{ env.GCP_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/luncher-repo/luncher:${{ steps.slug.outputs.sha7 }}" \
            --region "${{ env.GCP_LOCATION }}" \
            --platform managed
