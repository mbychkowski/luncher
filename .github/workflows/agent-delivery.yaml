name: Agent Delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'agents/luncher-agent/**'

jobs:
  agent-test-and-deploy:
    name: Build & Deploy Agent (Infra + Code)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_WI_PROVIDER_ID: ${{ vars.GCP_WI_PROVIDER_ID }}
      GCP_SA_GITHUB_ACTIONS: ${{ vars.GCP_SA_GITHUB_ACTIONS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and agents-cli
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pip install google-agents-cli

      - name: Authenticate to Google Cloud Project
        uses: 'google-github-actions/auth@v2'
        with:
          service_account: ${{ env.GCP_SA_GITHUB_ACTIONS }}@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          workload_identity_provider: ${{ env.GCP_WI_PROVIDER_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      # ==========================================
      # 🧱 Phase 1: Deploy Agent Infrastructure (Terraform)
      # ==========================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.3"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=bkt-tf-state-${{ env.GCP_PROJECT_ID }}-${{ github.event.repository.name }}" \
            -backend-config="prefix=agent-state"
        working-directory: agents/luncher-agent/deployment/terraform/single-project

      - name: Terraform Apply (Infra Setup)
        run: |
          terraform apply \
            -auto-approve \
            -var "project_id=${{ env.GCP_PROJECT_ID }}" \
            -var "region=${{ env.GCP_LOCATION }}" \
            -var "project_name=luncher-agent"
        working-directory: agents/luncher-agent/deployment/terraform/single-project

      # ==========================================
      # 🐍 Phase 2: Sync and Deploy Python Application Code
      # ==========================================
      - name: Sync Agent Dependencies
        run: |
          cd agents/luncher-agent
          uv sync --prerelease=allow
        env:
          UV_SYSTEM_PYTHON: 1

      - name: Deploy Code to Agent Runtime
        run: |
          cd agents/luncher-agent
          agents-cli deploy \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_LOCATION }} \
            --no-confirm-project
