# Graders for traces captured over A2A (`05-run-evals.sh luncher --a2a`), which
# is the path A2UI clients such as Gemini Enterprise use. The executor withholds
# every author but the synthesizer there, so what reaches the caller differs from
# the ADK REST response eval_config.yaml grades.

metrics_to_run:
  - single_voice
  - a2ui_payload_valid

custom_metrics:
  # Deterministic. Each author's answer arrives as its own text part, so more
  # than one means a gatherer reached the caller.
  - name: single_voice
    custom_function_file: single_voice.py

  # Deterministic. Over A2A the surface is a data part rather than the
  # <a2ui-json> text the dev UI renders, so this also proves the conversion at
  # the A2A boundary, not just that the agent emitted something.
  - name: a2ui_payload_valid
    custom_function_file: a2ui_validity.py
